<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Offer - EcoFood DZ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: #2e8b57;
            margin-top: 30px;
        }
        form {
            background: white;
            padding: 25px;
            display: inline-block;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
            text-align: left;
        }
        input, select {
            margin: 10px 0;
            padding: 10px;
            width: 250px;
            display: block;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #2e8b57;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #256b45;
        }
        a {
            color: #2e8b57;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>✏️ Edit Offer</h1>

    <form method="post">
        <label>Restaurant name:</label>
        <input type="text" name="restaurant" value="{{ offer.restaurant }}" required>

        <label>Dish name:</label>
        <input type="text" name="plat" value="{{ offer.plat }}" required>

        <label>Price (DA):</label>
        <input type="number" name="prix" value="{{ offer.prix }}" required>

        <label>Type:</label>
        <select name="type" required>
            <option value="Sale" {% if offer.type == 'Sale' %}selected{% endif %}>Sale</option>
            <option value="Donation" {% if offer.type == 'Donation' %}selected{% endif %}>Donation</option>
        </select>
