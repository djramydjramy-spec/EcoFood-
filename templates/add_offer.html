<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Offer - EcoFood DZ</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #2e8b57;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        h1 {
            color: #2e8b57;
            margin-top: 30px;
        }

        form {
            background: white;
            padding: 25px;
            display: inline-block;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            margin-top: 30px;
        }

        input, select {
            margin: 10px;
            padding: 10px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #2e8b57;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #256b45;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #2e8b57;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <span>EcoFood DZ</span>
        </div>
        <div class="menu">
            <a href="/">Home</a>
            <a href="/offers">Offers</a>
            <a href="/add">Add Offer</a>
        </div>
    </nav>

    <h1>➕ Add a New Offer</h1>

    <form method="post">
        <input type="text" name="restaurant" placeholder="Restaurant name" required><br>
        <input type="text" name="plat" placeholder="Dish name" required><br>
        <input type="number" name="prix" placeholder="Price in DA (0 for donation)" required><br>

        <select name="type" required>
            <option value="Sale">Sale</option>
            <option value="Donation">Donation</option>
        </select><br>

        <button type="submit">Add Offer</button>
    </form>

    <br>
    <a href="/offers">← Back to Offers</a>
</body>
</html>
